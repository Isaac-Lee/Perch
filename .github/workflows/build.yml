name: Build installers

# Pull requests and manual runs build both installers and keep them as run artifacts.
# A tag like v0.1.0 also attaches them to a draft release for review before publishing.
# Docs-only PRs (Markdown, docs/, LICENSE) skip the build.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A new push to the same PR cancels the older run. Tag runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: desk/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest # Apple Silicon
            bundles: dmg
            artifact: desk/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desk/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # The Tauri build script needs the hook sidecar and the built frontend, also when only testing.
      - run: npm run hook
      - run: npm run build
      - name: Rust tests
        run: cargo test --workspace
        working-directory: desk/src-tauri
      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v6
        with:
          name: perch-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # One draft release per tag, after both installers are built.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check version and notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          bad=0
          for f in desk/package.json desk/src-tauri/tauri.conf.json; do
            [ "$(jq -r .version "$f")" = "$v" ] || { echo "::error::$f version != $v"; bad=1; }
          done
          for f in desk/src-tauri/Cargo.toml desk/src-tauri/hook/Cargo.toml; do
            [ "$(sed -n 's/^version = "\(.*\)"/\1/p' "$f" | head -1)" = "$v" ] || { echo "::error::$f version != $v"; bad=1; }
          done
          [ -f "docs/releases/$GITHUB_REF_NAME.md" ] || { echo "::error::docs/releases/$GITHUB_REF_NAME.md is missing"; bad=1; }
          exit $bad
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Perch $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" dist/*/*
