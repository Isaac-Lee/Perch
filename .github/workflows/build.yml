name: Build installers

# Pull requests and manual runs build both installers and keep them as run artifacts.
# A tag like v0.1.0 also attaches them to a draft release for review before publishing.
# Docs-only PRs (Markdown, docs/, LICENSE) skip the build.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: desk/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest # Apple Silicon
            bundles: dmg
            artifact: desk/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desk/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk/src-tauri
      - run: npm ci
      - run: npm test
      # The Tauri build script needs the hook sidecar and the built frontend, also when only testing.
      - run: npm run hook
      - run: npm run build
      - name: Rust tests
        run: cargo test --workspace
        working-directory: desk/src-tauri
      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: perch-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Perch $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ../${{ matrix.artifact }} --clobber
