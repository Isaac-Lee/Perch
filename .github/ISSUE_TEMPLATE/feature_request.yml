name: 기능 제안
description: 새 기능이나 개선 아이디어
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 불편이 있나
      description: 지금 무엇을 하려는데 무엇이 막히는지 적는다.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 원하는 동작
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 지금 쓰는 우회 방법이나 다른 방법
